  <script>
    (() => {
      const root = document.getElementById('curator-pilot-nnxyz');
      const data = JSON.parse(root.querySelector('#curator-pilot-data').textContent);
      const picker = root.querySelector('#curator-pilot-work');
      const node = id => root.querySelector('#curator-pilot-' + id);
      for (const item of data) {
        const option = document.createElement('option');
        option.value = item.artworkId;
        option.textContent = item.title;
        picker.appendChild(option);
      }
      const render = id => {
        const item = data.find(x => x.artworkId === id) || data[0];
        picker.value = item.artworkId;
        node('image').src = item.image;
        node('image').alt = item.visualObservations.map(x => x.text).join(' ');
        node('caption').textContent = item.title + ' · archived image preview';
        node('title').textContent = item.title;
        node('facts').textContent = item.compactTechnical;
        node('reading').textContent = item.curatorialReading.text;
        node('context').textContent = item.collectionContext.text;
        node('related-title').textContent = 'Compare ' + item.connections[0].targetTitle;
        node('related').textContent = item.connections[0].reason;
        node('question').textContent = item.lookingQuestion;
        const technical = node('technical');
        technical.replaceChildren();
        for (const fact of item.technical) {
          const dt = document.createElement('dt');
          const dd = document.createElement('dd');
          dt.textContent = fact.label;
          dd.textContent = typeof fact.value === 'object' ? fact.value.width + ' × ' + fact.value.height : String(fact.value);
          technical.append(dt, dd);
        }
      };
      const applyState = state => render(state?.modelContent?.artworkId);
      applyState(window.openai?.widgetState);
      picker.addEventListener('change', () => {
        render(picker.value);
        const item = data.find(x => x.artworkId === picker.value);
        window.openai?.setWidgetState({modelContent:{artworkId:item.artworkId,title:item.title,view:'curatorial-pilot'},privateContent:null}).catch(() => {});
      });
      window.addEventListener('openai:set_globals', event => applyState(event.detail?.globals?.widgetState));
    })();
  </script>
