name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: pipx run --spec ruff==0.17.0 ruff check tools tests
      - run: pipx run --spec ruff==0.17.0 ruff format --check tools tests
      - run: npm audit --audit-level=high
      - run: pipx run --spec cfn-lint==1.57.2 cfn-lint infra/storage.json infra/certificate.json infra/site.json infra/delivery.json
      - run: npm run validate:infra
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript,python
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
      - name: Reject high or critical security findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${GITHUB_REF}" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.id): \(.most_recent_instance.location.path)"' > /tmp/nnxyz-security-findings.txt
          if test -s /tmp/nnxyz-security-findings.txt; then
            cat /tmp/nnxyz-security-findings.txt
            exit 1
          fi
  # Builds pages only. Media is published once and referenced by URL, so this
  # job needs no AWS access and never downloads the archive. Branch protection
  # requires this job by name.
  build:
    name: Build and browser validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_TINYLYTICS_ENABLED: 'true'
      - run: npm run validate:site
      - run: npm run revision
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci-browser
      - name: Package the verified static build
        if: github.ref == 'refs/heads/main'
        run: tar -czf /tmp/nnxyz-site.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: verified-site
          path: /tmp/nnxyz-site.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: /tmp/nnxyz-gallery-qa/
          retention-days: 7
  # Main pushes that change archive data run the archive workflow before
  # deploying. Keep this pattern in step with the paths in archive.yml.
  archive-changes:
    name: Archive data changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo changed=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(curation/|data/(gallery|abstract|tokens)\.json$|infra/(abstract-)?dataset.*\.json$|tools/(verify-collection\.py|verify-abstract\.py|verify-curation-catalog\.py|build-token-links\.py|hydrate-collection\.mjs)$)'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
  archive:
    name: Archive verification before deploy
    needs: archive-changes
    if: needs.archive-changes.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/archive.yml
  deploy:
    name: Deploy
    needs: [quality, codeql, build, archive]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.quality.result == 'success' && needs.codeql.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.archive.result == 'success' || needs.archive.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-site
          path: .build/
      - run: mkdir -p dist && tar -xzf .build/nnxyz-site.tar.gz -C dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm run deploy
        env:
          GH_TOKEN: ${{ github.token }}
